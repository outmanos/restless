name: Static libcurl
description: Build libcurl and its dependencies statically, so node-libcurl needs no system curl

# No node-libcurl prebuilds exist for this Electron version, so postinstall compiles it.
# Windows builds its own dependencies through vcpkg.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y autoconf libtool-bin m4 pkg-config groff libfontconfig-dev rpm

    - if: runner.os == 'macOS'
      shell: bash
      run: brew install autoconf automake libtool pkg-config

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - id: versions
      shell: bash
      run: |
        echo "libcurl=8.23.0" >> "$GITHUB_OUTPUT"
        echo "binding=$(node -p "require('./package-lock.json').packages['node_modules/node-libcurl'].version")" >> "$GITHUB_OUTPUT"
        echo "node=$(node -v)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/libcurl-static
        key: libcurl-static-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.binding }}-${{ steps.versions.outputs.libcurl }}-${{ hashFiles('.github/actions/static-libcurl/action.yml') }}

    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BINDING: ${{ steps.versions.outputs.binding }}
        LIBCURL_RELEASE: ${{ steps.versions.outputs.libcurl }}
      run: |
        pip install setuptools
        source_dir="$(mktemp -d)"
        npm pack "node-libcurl@$BINDING" --pack-destination "$source_dir" --silent
        tar -xzf "$source_dir"/*.tgz -C "$source_dir"
        cd "$source_dir/package"
        PREFIX_DIR="$HOME/libcurl-static" ONLY_BUILD_DEPS=true MACOS_UNIVERSAL_BUILD=false \
          GIT_COMMIT=none GIT_REF_NAME=none bash scripts/ci/build.sh

    - shell: bash
      env:
        LIBCURL_RELEASE: ${{ steps.versions.outputs.libcurl }}
      run: |
        echo "npm_config_curl_config_bin=$HOME/libcurl-static/deps/libcurl/build/$LIBCURL_RELEASE/bin/curl-config" >> "$GITHUB_ENV"
        echo "npm_config_curl_static_build=true" >> "$GITHUB_ENV"
